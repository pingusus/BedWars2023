name: Build BedWars2023

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (assemble only, skip all publish tasks)
      run: ./gradlew assemble --no-daemon -x publishMavenJavaPublicationToMavenRepository -x publish -x publishToMavenLocal
      continue-on-error: false

    - name: List built files
      run: |
        echo "=== bedwars-plugin JARs ==="
        ls -lh bedwars-plugin/build/libs/ || echo "No plugin JARs found"
        echo ""
        echo "=== bedwars-api JARs ==="
        ls -lh bedwars-api/build/libs/ || echo "No API JARs found"

    - name: Upload BedWars Plugin
      uses: actions/upload-artifact@v3
      with:
        name: BedWars2023-Plugin
        path: bedwars-plugin/build/libs/*.jar
        if-no-files-found: warn

    - name: Upload BedWars API
      uses: actions/upload-artifact@v3
      with:
        name: BedWars2023-API
        path: bedwars-api/build/libs/*.jar
        if-no-files-found: warn
