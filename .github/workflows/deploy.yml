name: Build BedWars2023

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle (skip publishing)
      run: |
        ./gradlew build -x publish
        
    - name: Find JAR files
      run: |
        echo "Listing all JAR files..."
        find . -name "*.jar" -type f -exec ls -la {} \;
        
    - name: Upload Plugin JARs
      uses: actions/upload-artifact@v3
      with:
        name: BedWars2023-1.8.8-Fixed
        path: |
          bedwars-plugin/build/libs/*.jar
          bedwars-api/build/libs/*.jar
